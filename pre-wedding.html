<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pre-Wedding Photography — Rakesh Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <header class="site-header">
    <a class="logo" href="index.html">Unprocessed Memories<span>.</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="inner-page category-page">
    <a class="back-link" href="index.html">← Back to selected work</a>

        <figure class="gallery-item">

          <figcaption>01</figcaption>
        </figure>
        <figure class="gallery-item">
          <button class="photo-button" data-full="images/pre-wedding/pre-wedding-02.svg" data-caption="Pre-wedding couple portrait">

    <section class="next-category">
      <p class="eyebrow">KEEP EXPLORING</p>
      <a href="about.html">About the photographer <span>↗</span></a>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img id="lightboxImage" src="" alt="">
    <p id="lightboxCaption"></p>

  <footer>
    <span>© <span class="year"></span> Rakesh Photography</span>
    <a href="about.html">About</a>
